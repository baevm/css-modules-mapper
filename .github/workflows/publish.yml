name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # required: lets npm verify this workflow (trusted publishing)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # staged publishing needs npm 11.15.0+
      - run: npm ci
      - run: npm test
      # Uploads the release for review; it goes public only after a maintainer approves it with 2FA
      # (`npm stage approve <stage-id>` or the Staged Packages tab on npmjs.com).
      - run: npm stage publish
